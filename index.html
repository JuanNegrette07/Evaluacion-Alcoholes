<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación tipo ICFES · Los alcoholes</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; }
  .fade-in { animation: fadeIn .45s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .35s ease both; }
  @keyframes pop { 0% { transform: scale(.97); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body class="text-slate-800">

<main class="max-w-3xl mx-auto px-4 py-10">

  <!-- MÓDULO 2 -->
  <section id="modulo2">
    <h2 class="text-2xl sm:text-3xl font-extrabold text-indigo-800">Evaluación tipo ICFES · Los alcoholes</h2>
    <p class="text-slate-500 mb-4">Selecciona una sola respuesta por pregunta. Recibirás retroalimentación al instante.</p>

    <div class="bg-white rounded-2xl shadow-lg p-5 sm:p-8">
      <div class="flex items-center justify-between mb-2 text-sm text-slate-500">
        <span id="answered">Respondidas: 0 / 5</span>
        <span id="liveScore" class="font-semibold text-teal-700">Aciertos: 0</span>
      </div>
      <div class="h-2 bg-slate-100 rounded-full mb-6"><div id="quizBar" class="h-full w-0 bg-teal-400 rounded-full transition-all duration-500"></div></div>

      <div id="quiz" class="space-y-6"></div>

      <div class="mt-8 flex flex-wrap gap-3">
        <button id="finish" class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition">✅ Finalizar y ver puntaje</button>
        <button id="reset" class="px-6 py-3 rounded-xl bg-slate-200 text-slate-700 font-semibold hover:bg-slate-300 transition">🔄 Reiniciar</button>
      </div>
      <div id="result" class="mt-6"></div>
    </div>
  </section>
</main>


<script>
/* ============ DATOS MÓDULO 2 ============ */
const quiz = [
  { q: "¿Qué grupo funcional caracteriza a los alcoholes?",
    o: ["–COOH", "–OH", "–NH₂", "–CHO"], c: 1,
    e: "Los alcoholes se caracterizan por el grupo hidroxilo (–OH)." },
  { q: "¿Cuál alcohol puede utilizarse como biocombustible?",
    o: ["Etanol", "Etilenglicol", "Metanol en productos domésticos", "Fenol"], c: 0,
    e: "El etanol puede producirse por fermentación de azúcares y usarse como biocombustible." },
  { q: "¿Qué se obtiene mediante la esterificación de un alcohol con un ácido carboxílico?",
    o: ["Un metal", "Una sal", "Un éster y agua", "Oxígeno solamente"], c: 2,
    e: "En la esterificación, el alcohol reacciona con un ácido carboxílico y produce un éster y agua." },
  { q: "¿Cuál es una aplicación del isopropanol?",
    o: ["Fabricar minerales", "Utilizarlo como disolvente y limpiador", "Producir sal común", "Fabricar hierro directamente"], c: 1,
    e: "El isopropanol se emplea en productos de limpieza y como disolvente." },
  { q: "¿Por qué deben manipularse los alcoholes con precaución?",
    o: ["Porque todos son inofensivos", "Porque ninguno reacciona", "Porque algunos son tóxicos y muchos son inflamables", "Porque no contienen carbono"], c: 2,
    e: "Muchos alcoholes son inflamables y algunos, como el metanol, son tóxicos." }
];
const L = ["A", "B", "C", "D"];
let answers = Array(quiz.length).fill(null);
const quizEl = document.getElementById("quiz");

function renderQuiz() {
  quizEl.innerHTML = quiz.map((q, qi) => `
    <div class="rounded-2xl border border-slate-200 p-4 sm:p-5 fade-in" id="q${qi}">
      <p class="font-bold text-slate-800"><span class="text-indigo-600">${qi + 1}.</span> ${q.q}</p>
      <div class="mt-3 grid gap-2">
        ${q.o.map((t, oi) => `<button data-q="${qi}" data-o="${oi}" class="opt text-left px-4 py-3 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 transition"><span class="font-bold text-indigo-600 mr-2">${L[oi]}.</span>${t}</button>`).join("")}
      </div>
      <div class="fb mt-3 hidden text-sm rounded-lg p-3"></div>
    </div>`).join("");
}
quizEl.addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  const qi = +b.dataset.q, oi = +b.dataset.o;
  if (answers[qi] !== null) return;
  answers[qi] = oi;
  const box = document.getElementById("q" + qi), q = quiz[qi], ok = oi === q.c;
  box.querySelectorAll(".opt").forEach((btn, i) => {
    btn.disabled = true; btn.classList.remove("hover:border-indigo-400", "hover:bg-indigo-50");
    if (i === q.c) btn.className = "opt text-left px-4 py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
    else if (i === oi) btn.className = "opt text-left px-4 py-3 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-semibold";
    else btn.classList.add("opacity-60");
  });
  b.classList.add(ok ? "pop" : "shake");
  const fb = box.querySelector(".fb");
  fb.className = "fb mt-3 text-sm rounded-lg p-3 fade-in " + (ok ? "bg-emerald-100 text-emerald-900" : "bg-rose-100 text-rose-900");
  fb.innerHTML = (ok ? "✅ <b>¡Correcto!</b> " : `❌ <b>Incorrecto.</b> La respuesta correcta es ${L[q.c]}. `) + q.e;
  updateStats();
});
function score() { return answers.reduce((s, a, i) => s + (a === quiz[i].c ? 1 : 0), 0); }
function updateStats() {
  const n = answers.filter(a => a !== null).length;
  document.getElementById("answered").textContent = `Respondidas: ${n} / ${quiz.length}`;
  document.getElementById("liveScore").textContent = `Aciertos: ${score()}`;
  document.getElementById("quizBar").style.width = (n / quiz.length * 100) + "%";
}
document.getElementById("finish").onclick = () => {
  const res = document.getElementById("result"), n = answers.filter(a => a !== null).length;
  if (n < quiz.length) {
    res.innerHTML = `<div class="fade-in bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4">⚠️ Te faltan <b>${quiz.length - n}</b> pregunta(s) por responder.</div>`;
    return;
  }
  const s = score(), pct = s / quiz.length * 100;
  let title, msg, col;
  if (s === 5) { title = "🏆 ¡Excelente!"; msg = "Dominas el tema de los alcoholes. ¡Felicitaciones, sigue así!"; col = "emerald"; }
  else if (s >= 3) { title = "👏 ¡Buen trabajo!"; msg = "Vas por buen camino. Repasa las diapositivas de las preguntas que fallaste para afianzar el tema."; col = "teal"; }
  else { title = "📚 Sigue practicando"; msg = "Te recomendamos volver al Módulo 1, repasar con calma cada diapositiva y reintentar la evaluación."; col = "amber"; }
  res.innerHTML = `<div class="fade-in pop bg-${col}-50 border-2 border-${col}-300 rounded-2xl p-6 text-center">
    <p class="text-5xl font-extrabold text-indigo-700">${s} / ${quiz.length}</p>
    <p class="text-slate-500 text-sm">${pct}% de aciertos</p>
    <p class="text-2xl font-bold mt-3">${title}</p><p class="mt-1 text-slate-700">${msg}</p></div>`;
  res.scrollIntoView({ behavior: "smooth", block: "center" });
};
document.getElementById("reset").onclick = () => {
  answers = Array(quiz.length).fill(null);
  document.getElementById("result").innerHTML = "";
  renderQuiz(); updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

renderQuiz(); updateStats();
</script>
</body>
</html>
